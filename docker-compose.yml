services:
  api:
    build: .
    ports: ["8000:8000"]
    environment:
      DATABASE_URL: postgresql+psycopg://payrecover:payrecover@postgres:5432/payrecover
    depends_on:
      migrate: {condition: service_completed_successfully}
  migrate:
    build: .
    command: ["alembic", "upgrade", "head"]
    environment:
      DATABASE_URL: postgresql+psycopg://payrecover:payrecover@postgres:5432/payrecover
    depends_on:
      postgres: {condition: service_healthy}
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: payrecover
      POSTGRES_PASSWORD: payrecover
      POSTGRES_DB: payrecover
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U payrecover"]
      interval: 5s
      timeout: 3s
      retries: 10
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
